# Skip Gradle's whole-machine JDK toolchain auto-detection (scans
# /Library/Java/JavaVirtualMachines, ~/.jdks, SDKMAN, etc. on every build,
# triggering slow macOS Gatekeeper "Verifying ..." checks on old JDKs it
# hasn't touched recently). We always set JAVA_HOME explicitly before
# building (see ../README.md), so there's nothing for auto-detection to add.
org.gradle.java.installations.auto-detect=false
